<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="shopping.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalnia+Glaze:wght@100..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Rubik+Puddles&display=swap" rel="stylesheet">
  <title>Dynamic Shopping Cart</title>
</head>
<body>
    <article class = "container">
        <h1>Dynamic Shopping Cart</h1>
        <div id="product-container">
            <label for ="productName">Product:</label>
            <input type="text" id="product-name" maxlength="20" placeholder=" Product Name...">

            <label for ="productPriceInput">Price:</label>
            <input type="number" id="product-price" min="0.01" max="100" step="0.01" placeholder="Price...">
            <button id="add-product">Add Product</button>
        </div>
        <ul id="cartList"></ul>
        <h3>Total: $<span id="total-price">0</span></h3>
    </article>
  <script src="shopping.js"></script>
</body>
</html>
